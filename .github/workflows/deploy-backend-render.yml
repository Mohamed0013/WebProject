name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsSL "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || { echo "Deploy hook failed"; exit 1; }
